name: Deploy the paper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site (latest redirect + archive)
        run: |
          mkdir -p _site/issues
          cp issues/*.html _site/issues/
          latest=$(ls issues/*.html | sort | tail -n1)
          name=$(basename "$latest")
          printf '<!DOCTYPE html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=issues/%s"><title>The Sunday Rebase</title></head><body><a href="issues/%s">Latest issue</a> · <a href="archive.html">Archive</a></body></html>' "$name" "$name" > _site/index.html
          {
            printf '<!DOCTYPE html><html><head><meta charset="utf-8"><title>The Sunday Rebase · archive</title><style>body{font:16px/1.7 system-ui;max-width:640px;margin:40px auto;padding:0 20px}a{color:#2B5BD7}</style></head><body><h1>The Sunday Rebase</h1><p>Back issues, newest first.</p><ul>'
            for f in $(ls issues/*.html | sort -r); do
              b=$(basename "$f")
              printf '<li><a href="issues/%s">%s</a></li>' "$b" "${b%.html}"
            done
            printf '</ul></body></html>'
          } > _site/archive.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
